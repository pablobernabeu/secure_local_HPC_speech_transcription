# hpc_advance plan for the secure-local-HPC speech-transcription project.
#
# This project shares the ARC account with several unrelated projects
# (claps_*, bfda_*, p1_/p2_* decoding). The name_glob filters below keep
# hpc_advance watching only this project's jobs. fnmatch is exact, so each
# glob is written for the names the stage's jobs ran under. Where a stage
# also lists detect.arrays, only those job IDs belong to it: its name_glob
# alone would also match another stage's jobs.
#
# An outputs glob may reach one directory down ("*/der_summary.json"). Count
# it with the shell, `ls -1 <path>/<glob> | wc -l`, since `find -name` does
# not match a pattern with a slash in it.
#
# STATE ON 2026-10-04, read with sacct, squeue and sinfo at 22:00 BST: every
# stage below is complete, and every result the evaluation reports from them
# is committed. No job of this project is queued or running, and no wave is
# pending.
#
# LOCAL FOLLOW-UP 2026-10-06: reader-cluster sensitivity intervals over the
# committed LibriSpeech reports need no ARC run and are rebuilt by
# tools/verify_regeneration.py. Optional repeated-passage review is tested
# locally; the archived case-study review has not been replaced. Its full
# transcript would be needed to evaluate the new flags on that run. These
# additions change none of the stages or the cluster snapshot recorded here.
#
# ARCHIVE FOLLOW-UP 2026-10-06: read-only recovery copied all 255 summary
# JSON files and 15 hypothesis CSVs from audit2026/sweep. All 270 remote
# SHA-256 digests match. Strict local aggregation reproduces the complete
# 255-row CSV byte for byte and all scientific JSON fields; input paths,
# aggregation time and current run metadata differ. The inputs and proof
# are in ignored build/recovered_arc_sweep/, pending public archiving and
# attribution. No new jobs or decoding were needed. The proposed NEW-05
# Spanish V100 control remains separate from the completed stages below.
# The reviewed commands are in docs/next_control.md: a 5-utterance,
# 30-minute preflight followed by a raw-only Spanish full split only after
# inspection. Read-only checks on 2026-10-06 found the clean 6f9bf56 clone,
# all 178 ARC lock pins unchanged and both 908-utterance comparison inputs
# hash-verified. V100 nodes were mixed, P100s drained, and no matching
# project job queued/running. New submissions still use confirm below.
# - The audit's re-run wave at code 6f9bf56 (clone
#   ~/paper_speech_transcription_audit, outputs under
#   $DATA/speech_transcription_env/output/evaluation/audit2026/) is complete
#   and its results are committed: the WER matrix (2e36bf9, 9cb43e3), the
#   headline pair from it (e3cb675, 27cb15c) and the Large v3 AMI reports
#   behind the normaliser's AMI gain (9507e0c, 81d8054), the timestamp
#   benchmark (567cfd9), FLEURS arm 4 (56ce519, 51e6d47), anonymisation
#   (8b6144c) and the reconstruction audit (942d2c1). Filler preservation
#   was rescored locally from the sweep's AMI dump (a6dd82f, 9732ac0). Its
#   case study, 8918023 (au_case), failed because test-suite jobs 8913985
#   and 8917186 had written a stub over the cached pyannote pipeline config
#   (incident NEW-INC-01). The blob was restored on 2026-10-04 at 00:03 and
#   hashed to its own name when checked again at 07:10.
# - Wave 2a, from clone ~/paper_speech_transcription_audit_w2 at 9cb43e3:
#   the six DER re-runs au_der_* (8976354 to 8976358 and 8976362), on L40S
#   cards, all COMPLETED 0:0 on 2026-10-04 between 09:45 and 11:28, and
#   committed in 70933b4 (stages der_rerun and der_sweep_rerun).
# - Wave 2b, submitted 2026-10-04 04:50 from clone
#   ~/paper_speech_transcription_audit_w2b at f2578b8: test suite 8978757
#   COMPLETED (2032 passed, 1 skipped, 1 xfailed). The case-study re-run
#   8978758 FAILED at its structural evaluation (see case_study). The
#   determinism check's CPU arm 8978759 COMPLETED at 06:08 and is committed
#   (ddb37e6, 9084c63). Its V100 run 8978760 COMPLETED at 11:38 and is
#   committed (203d3ba, c813fe5). Stages test_suite, case_study,
#   determinism_cpu and determinism_v100.
# - Wave 2c, from the clone ~/paper_speech_transcription_audit_w2c at
#   c4c7b38, which fixes the case study's corpus manifest (NEW-06): test
#   suite 8983111 COMPLETED (2058 passed, 1 skipped, 1 xfailed), then the
#   case study 8983112 COMPLETED 0:0, committed in ac08cdc (stages
#   test_suite and case_study).
# - Jobs 8781723 and 8781724 (2026-09-12) are long done. 8781724's results
#   are committed in output/evaluation/determinism/l40s_8781724/ (3efc8c8)
#   and compared with the other runs in determinism_cross_accelerator.json
#   (3efc8c8, 06d5a53). 8781723 (anon_multimeeting/ on ARC) broke the
#   per-meeting cap (EPRIV-03), was superseded by 8917989 and was never
#   committed.
# - The 2026-09-10 plan to run the determinism check's desktop half on the
#   local machine is superseded by hpc/submit_determinism_cpu.sh, which
#   decodes on an ARC CPU node in the jobs' own environment (8978759). A
#   local run would use a different software stack, so it would not
#   isolate the hardware.
# - The footprint ledger and summary were rebuilt from a read-only sacct
#   dump taken on 2026-10-04 at 13:45:36 BST, after the last job to end
#   (8978760) had finished: 197 jobs from 2026-05-16, each GPU job priced at
#   the board of its node (e3e436d). The dump is not committed, because it
#   lists the account's other projects, but arc_job_ledger_provenance.json
#   records its query and SHA-256. Where the window opens is the author's
#   decision (2026-05-20, the June capture's start, would drop 18 jobs).
#
# GPU types vary by job, since most scripts ask for any GPU. Each record
# in hpc/runs/ names the card its run used, and the sbatch command it gives
# asks for that card type:
#   - sweep.env: Large v3 on a Tesla V100-PCIE-32GB (gpu:v100), Whisper
#     Medium and distil-large-v3 on an NVIDIA L40S (gpu:l40s).
#   - fleurs_ml.env: FLEURS arm 4, tasks 0 and 3 on the h100 type with the
#     nvlink feature, task 1 on the a100 type and tasks 2, 4 and 5 on l40s.
#   - timestamps.env, timestamps_vad.env: an NVIDIA H100 80GB HBM3, with
#     --gres=gpu:h100:1 --constraint=nvlink.
#   - anonymisation.env, anonymisation_single_meeting.env: an L40S.
#   - der_default.env, der_oracle.env, der_tuned.env, der_concat.env,
#     der_sweep.env, der_sweep2.env: an L40S (since 2776541).
#   - case_study.env: the a6000 type, an NVIDIA RTX A6000.
#   - determinism_v100.env: a V100, through SBATCH_GRES=gpu:v100:1.
#   - determinism.env names the H100 NVL and the L40S of its two runs, but
#     its command asks for any GPU, and determinism_cpu.env runs on a
#     processor.
# Jobs write their GPU, code commit and Python stack into
# <report dir>/environment/ (hpc/common/arc_common.sh).
#
# No job installs or repairs packages: each runs `python -m preflight`
# through hpc/common/arc_common.sh and exits 2 when it fails (4 for the case
# study). From a07b47e on, the preflight of a diarisation job also fails on
# a damaged cached pyannote pipeline config. Wave 2a's clone (9cb43e3)
# predates that check, but each of its logs shows the preflight passing with
# --diarisation-required and the pipeline loading (70933b4). Some jobs also
# refuse to start over an earlier run's results (exit 3 for the determinism
# jobs, 6 for the case study). An exit within seconds of the start is
# therefore a failure for the poller to report, not a finished stage.
#
# The invocations (env overrides and job IDs) behind the committed
# artefacts are in hpc/runs/*.env, and the scripts' defaults do not
# reproduce them: the WER sweep (sweep.env), FLEURS arm 4 (fleurs_ml.env),
# the timestamp runs (timestamps.env, timestamps_vad.env), anonymisation
# (anonymisation.env, anonymisation_single_meeting.env), the DER runs
# (der_default.env, der_oracle.env, der_tuned.env, der_concat.env,
# der_sweep.env, der_sweep2.env), the determinism check (determinism.env,
# determinism_cpu.env, determinism_v100.env) and the case study
# (case_study.env). Each sends a reproduction to its own directory under
# repro/, and its commands stop at "|| exit 1" when the record cannot be
# read (95209a6).
#
# CLUSTER NOTE 2026-10-04: the three P100 nodes, htc-g032 to g034, have been
# drained since 2026-09-04 ("to be decommissioned"), and still were at 21:59
# BST, so no job can run on a P100. Judge capacity by node state, not by
# queue depth alone.
#
# The cluster remains heavily loaded by the other projects (claps_*, p1_*,
# bfda_*), so any later wave should still be sized modestly. GPU work
# outside the stages below:
#   - a decoding-configuration arm for whisper-medium on AMI. Still no
#     script, and still no stated question it would answer. Ask before
#     writing one.
#   - the check of FLEURS arm 4's GPU attribution (NEW-05). A pl_pl decode
#     on a P100, where arm 3 ran it, cannot be made, since the P100 nodes
#     are drained to be decommissioned. NEW-05 proposes in its place an
#     es_419 decode at 6f9bf56 on a V100, the GPU model arm 3 decoded
#     Spanish on. It has no stage and has not been submitted (see
#     fleurs_multilingual).
#   - (RESOLVED) the Large v3 hypothesis dump lost to the path collision:
#     the audit's sweep kept a dump for each of its 15 suite and model
#     pairs in audit2026/sweep/.
#
# PARTITION NOTE: on ARC, `htc` is the CLUSTER, not a partition. Every
# script here submits with `--clusters=htc --partition=short` (or
# `medium` for the 48h CPU-only run). A generic default of
# `--partition=htc` would be rejected.

version: 1

cluster:
  ssh_alias: arc-agent
  user: educ1242
  clusters: htc
  accounts: [educ-lift, educ-intract]
  default_account: educ-intract # see BALANCE below
  partition: short              # `htc` is the cluster; `short` is the partition
  qos: standard                 # ALWAYS standard; never --qos=priority
  # BALANCE: over the 30 days to 2026-08-20 educ-lift carried 982 jobs and
  # 25,426 wall-hours against educ-intract's 753 and 4,746, about 5.4x the
  # load, because most submit scripts documented educ-lift as their default.
  # The default is now educ-intract and the scripts' usage lines were changed
  # to match. Re-check the split before a large wave rather than assuming
  # this still holds; `userbalance` is broken on the login node (glsuser and
  # gbalance are missing), so use sacct wall-hours by account instead.

poll:
  interval_seconds: 1800
  sacct_since: now-5days

autonomy: confirm

# Shorthand for the shared output directory used by the done-conditions.
# $DATA = /data/educ-lift/educ1242
_output_dir: &out "/data/educ-lift/educ1242/speech_transcription_env/output/evaluation"

stages:
  - name: wer_sweep
    detect:
      # The jobs behind the committed matrix ran as au_wer_large,
      # au_wer_med and au_wer_dis, after the pre-flights pf_wer_*. The
      # script's own name is wer_sweep, and the post-fix passes ran as
      # wer_sweep_postfix, wer_sweep_pf_med and wer_sweep_pf_dis, so set
      # this glob to a new sweep's names before watching it.
      name_glob: "*_wer_*"
    done_when:
      queue_empty: true
      outputs:
        # The SWEEP_OUTPUT_DIR of the sweep behind the committed matrix.
        # Point this at a new run's directory before a new sweep: a
        # finished directory already satisfies the count.
        path: "/data/educ-lift/educ1242/speech_transcription_env/output/evaluation/audit2026/sweep"
        # No underscore after "summary", so that the legacy names
        # wer_summary.json and wer_summary_<condition>.json, which the
        # post-fix pass wrote in postfix/, match as well as the suite- and
        # model-qualified names a sweep now writes.
        glob: "wer_summary*.json"
        # One summary per (suite, model, condition): 5 suites x 17
        # conditions (evaluation.conditions.default_sweep_conditions(),
        # raw and pronoun_i_fix included) x 3 models = 255.
        # audit2026/sweep holds exactly 255 (checked 2026-10-04).
        min_count: 255
    on_failure: report
    # The proceed step rebuilds the committed aggregate on ARC from the 255
    # summaries in done_when.path, into sweep_aggregate.{csv,json} beside
    # them, to be compared with output/evaluation/sweep_aggregate.*, which
    # evaluation.sweep_aggregate built locally at 7214e77 from copies of
    # the same files (2e36bf9; see sweep_aggregate). It sets no
    # PIPELINE_VERSION: all 255 summaries record their commit, 6f9bf56,
    # which becomes each row's pipeline_version (hpc/aggregate_sweep.sh,
    # checked 2026-10-04). It runs from the w2b clone, at f2578b8; any clone
    # at or after 2e36bf9 would do, but not ~/paper_speech_transcription,
    # at 1bb68ba, whose aggregator writes no pipeline_version or input
    # digests and does not refuse a repeated cell. For a new sweep, put its
    # SWEEP_OUTPUT_DIR in SWEEP_DIR below and in done_when.path.
    proceed:
      description: "rebuild the committed 255-row sweep aggregate on ARC from audit2026/sweep"
      run: "ssh arc-agent 'cd $HOME/paper_speech_transcription_audit_w2b && SWEEP_DIR=$DATA/speech_transcription_env/output/evaluation/audit2026/sweep sbatch --account=educ-intract hpc/aggregate_sweep.sh'"
      autonomy: confirm
    notes: >
      submit_sweep.sh, array 0-4 (one suite each), one model per submission
      via SWEEP_MODEL. COMPLETE: the audit's re-run on 2026-09-28 at
      6f9bf56, 8917985 (Large v3, educ-intract, Tesla V100-PCIE-32GB),
      8917986 (Whisper Medium, educ-lift, NVIDIA L40S) and 8917987
      (distil-large-v3, educ-intract, NVIDIA L40S), each after a
      SWEEP_LIMIT=10 pre-flight (8913987 to 8913989), with
      DUMP_HYPOTHESES=1; recipe hpc/runs/sweep.env. Committed in
      output/evaluation/: 2e36bf9 (the 255-row matrix and
      sweep_reports_postfix/), 9cb43e3 (condition_ci_postfix), e3cb675 and
      27cb15c (the headline pair, which is the raw Large v3 test-clean cell,
      and its interval), and 9507e0c (sweep_reports_postfix_ami/, the raw
      and whisper_norm reports of 8917985's AMI task, from which 81d8054
      computed normaliser_gain_ami.csv locally). It
      supersedes the post-fix passes 8688725 (Large v3) and 8708134 and
      8708135 (Medium, distil), committed in 53378ba and aa6e61d, whose 240
      summaries stay in postfix/ on ARC. Their pre-flights ran as
      wer_sweep_pre: 8656348 exposed that the dump argument was never
      passed and that tasks failed at interpreter teardown (both fixed in
      25068a8), and 8679910 came back clean.
      Always pre-flight a new run with SWEEP_LIMIT=10, and send the
      pre-flight to its own SWEEP_OUTPUT_DIR: it writes the same filenames
      as a real run, and the script refuses SWEEP_LIMIT without
      SWEEP_OUTPUT_DIR.
      DUMP_HYPOTHESES=1 is the point of the exercise: with the hypotheses
      kept, any later post-processing change is rescored on CPU and never
      needs the GPU again. The dumps have been keyed on suite and model
      since the post-fix pass, in which the three models overwrote each
      other's dumps (tests/test_sweep_dump_paths.py stops it recurring).
      NOTE for aggregation on Windows: the scratchpad path plus these
      filenames exceeds MAX_PATH, which silently drops the longest names and
      produced 57 of 80 rows. Aggregate from a short path.

  - name: sweep_aggregate
    requires: [wer_sweep]
    detect:
      name_glob: "sweep_aggregate"
    done_when:
      queue_empty: true
      # No outputs gate. The committed 255-row aggregate (2e36bf9) was built
      # locally by evaluation.sweep_aggregate at 7214e77 from the summaries
      # fetched off ARC; no aggregate_sweep.sh job ran over audit2026/sweep/,
      # which holds no sweep_aggregate.json (checked 2026-10-04). For a
      # sweep aggregated on ARC, gate on
      #   outputs: {path: <its SWEEP_DIR>, glob: "sweep_aggregate.json", min_count: 1}
    notes: >-
      aggregate_sweep.sh (default SWEEP_DIR audit2026/sweep/). COMPLETE for
      the committed matrix, aggregated locally (2e36bf9); the JSON's
      provenance block holds the SHA-256 of each of the 255 summaries.

  - name: ami_cache
    detect:
      name_glob: "ami_cache"
    done_when:
      queue_empty: true
      outputs:
        # The reconstruction audit behind the committed
        # reconstruction_audit_{test,validation}.json (942d2c1), one record
        # per split. submit_ami_cache.sh writes the same files to its
        # REPORT_DIR after building the cache.
        path: "/data/educ-lift/educ1242/speech_transcription_env/output/evaluation/audit2026/reconstruction_audit"
        glob: "reconstruction_audit_*.json"
        min_count: 2
    on_failure: report
    notes: >-
      submit_ami_cache.sh. CPU only. Rebuilds AMI validation and test
      meetings on their original timeline into $DATA/ami_cache, which the
      diarisation jobs read instead of downloading the corpus again for
      every configuration (der_sweep, benchmark_der and their wave 2a
      re-runs, and Phase 3 of submit_finetune_pyannote.sh). The
      disfluency, determinism and anonymisation jobs stream AMI through
      datasets and do not read it, so their stages do not require this
      one. The job then runs
      python -m evaluation.audit_reconstruction on each split's
      <split>_timeline_full cache and writes
      reconstruction_audit_<split>.json to REPORT_DIR (default the shared
      evaluation directory). The job exits non-zero when an audit finds a
      displaced reconstruction, which must stop the DER stages below: they
      would score a misaligned corpus. COMPLETE: job 8534741 built the cache
      on 2026-08-10 (htc-c020), and job 8918334 (au_recon_audit,
      2026-09-27, at 6f9bf56) audited it read-only into
      audit2026/reconstruction_audit/, committed in 942d2c1: best alignment
      shift 0 ms and silence purity 1.0 for all 34 meetings.

  - name: der_sweep
    requires: [ami_cache]
    detect:
      name_glob: "der_sweep"
    done_when:
      queue_empty: true
      outputs:
        # The August sweeps wrote into der_sweep_dev/ and der_sweep_dev2/,
        # each as der_sweep_selection.json (--output-prefix came later).
        path: *out
        glob: "der_sweep_dev*/der_sweep_selection.json"
        min_count: 2
    notes: >-
      submit_der_sweep.sh. Hyperparameter grid on the AMI *validation*
      split only; the test split must stay untouched until the
      configuration is fixed. COMPLETE: 8534758 (five thresholds) and
      8534792 (the default cell and a 3 x 3 grid), 2026-08-10, first
      committed as der_sweep* (aaffb81) and der_sweep2* (3645869).
      Superseded: their wave 2a re-runs (der_sweep_rerun) replaced those
      files in 70933b4, and hpc/runs/der_sweep.env and der_sweep2.env now
      describe the re-runs and keep these jobs as history.

  - name: benchmark_der
    requires: [der_sweep]
    detect:
      name_glob: "benchmark_der"
    done_when:
      queue_empty: true
      outputs:
        # The four August runs wrote into der_default/, der_tuned/,
        # der_oracle/ and der_concat/; der_default/'s pair was committed as
        # der_summary.json and der_report.csv.
        path: *out
        glob: "der_*/der_summary.json"
        min_count: 4
    notes: >-
      submit_benchmark_der.sh, AMI IHM test split, pyannote 3.1,
      timeline reconstruction. Scores the default and the
      development-selected configuration on held-out test. COMPLETE,
      2026-08-10: 8534772 (default), 8535638 (tuned), 8534775 (oracle
      speaker count) and 8534773 (the old concatenation protocol), first
      committed in aaffb81 and 3645869 (der_tuned/). Superseded: their wave
      2a re-runs (der_rerun) replaced those files in 70933b4, and
      hpc/runs/der_*.env now describe the re-runs and keep these jobs as
      history.

  # ---------------------------------------------------------------------
  # Wave 2a: the DER re-runs, submitted 2026-10-04 00:15 to 00:18 from
  # clone ~/paper_speech_transcription_audit_w2 at 9cb43e3, each asking for
  # an L40S. Each job wrote into its own subdirectory of audit2026/der/,
  # named at submission; its log in that clone, logs/benchmark_der_<id>.out
  # or logs/der_sweep_<id>.out, prints it as "Report dir:", with the run's
  # settings beside it. 9cb43e3 predates the preflight check on the cached
  # pipeline config, but every log shows the preflight passing with
  # --diarisation-required, the pipeline loading and the intended settings,
  # with only the usual pyannote warnings on stderr (70933b4).
  # ---------------------------------------------------------------------
  - name: der_rerun
    requires: [ami_cache]
    detect:
      name_glob: "au_der_*"
      arrays: [8976354, 8976355, 8976356, 8976357]
    done_when:
      queue_empty: true
      outputs:
        path: "/data/educ-lift/educ1242/speech_transcription_env/output/evaluation/audit2026/der"
        glob: "*/der_summary.json"
        min_count: 4
    on_failure: report
    notes: >-
      submit_benchmark_der.sh, re-runs of the four August test-split jobs
      (hpc/runs/der_default.env, der_tuned.env, der_oracle.env,
      der_concat.env): au_der_default 8976354 (educ-intract), au_der_oracle
      8976355 (educ-lift), au_der_tuned 8976356 (educ-intract) and
      au_der_concat 8976357 (educ-lift). COMPLETE: all four COMPLETED 0:0
      on 2026-10-04 between 09:45:36 and 10:31:51 by sacct, on NVIDIA L40S
      cards (htc-g070 for the default and oracle runs, htc-g066 for the
      tuned and concatenation runs), from the clean clone at 9cb43e3.
      Committed in 70933b4 (merged in a3d80c3) into output/evaluation/:
      der_summary.json and der_report.csv (the default run), der_tuned/,
      der_oracle/ and der_concat/. Against the August runs only EN2002c
      moved, by 5e-6 in DER (EDER-02), and der_concat/der_report.csv is the
      August file byte for byte. The four records (2776541) ask for an L40S.

  - name: der_sweep_rerun
    requires: [ami_cache]
    detect:
      name_glob: "au_der_sweep*"
      arrays: [8976358, 8976362]
    done_when:
      queue_empty: true
      outputs:
        path: "/data/educ-lift/educ1242/speech_transcription_env/output/evaluation/audit2026/der"
        # der_sweep_selection.json, or der_sweep2_selection.json from a run
        # that set OUTPUT_PREFIX=der_sweep2, as hpc/runs/der_sweep2.env does.
        glob: "*/der_sweep*_selection.json"
        min_count: 2
    on_failure: report
    notes: >-
      submit_der_sweep.sh on the validation split, re-runs of the two
      August sweeps (hpc/runs/der_sweep.env, der_sweep2.env): au_der_sweep
      8976358 (educ-intract) and au_der_sweep2 8976362 (educ-lift).
      COMPLETE: both COMPLETED 0:0 on 2026-10-04, from 09:56:56 to 10:33:32
      and from 10:30:24 to 11:27:47 by sacct, on L40S cards (htc-g070,
      htc-g066), from the clean clone at 9cb43e3. Committed in 70933b4
      (merged in a3d80c3) as output/evaluation/der_sweep.csv,
      der_sweep_summary.csv and der_sweep_selection.json, and the
      der_sweep2 trio. The first sweep now scores the pipeline defaults as
      cfg000, six configurations where August had five. Both still select
      threshold 0.70, minimum cluster size 12 and no minimum pause, the
      configuration of der_tuned/. Only IB4002 moved against August, its
      DER by at most 3.7e-4 in a cell (EDER-02).

  - name: benchmark_timestamps
    detect:
      # The committed runs were au_ts and au_ts_vad; the script's own name
      # is benchmark_timestamps.
      name_glob: "au_ts*"
    done_when:
      queue_empty: true
      outputs:
        path: "/data/educ-lift/educ1242/speech_transcription_env/output/evaluation/audit2026/timestamps"
        glob: "timestamp_summary.json"
        min_count: 1
    notes: >-
      submit_benchmark_timestamps.sh, AMI IHM, large-v3. COMPLETE: 8917980
      (au_ts, educ-lift) and 8917981 (au_ts_vad, --vad-refine,
      educ-intract, outputs in audit2026/timestamps_vad/), 2026-09-27 at
      6f9bf56 on an NVIDIA H100 80GB HBM3 (htc-g059), after the pre-flights
      8913990 and 8913991; committed in 567cfd9, with corrections in
      d7b7df9, into output/evaluation/ and output/evaluation_vad_refine/.
