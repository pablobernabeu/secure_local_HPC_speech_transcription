name: CPU verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Check out the source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up the recorded Python version
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.12"
      # The runner context is not available in a job's env, only in its
      # steps, so the job-scoped temporary directory is exported here.
      - name: Use a job-scoped temporary directory
        run: |
          mkdir -p "$RUNNER_TEMP/cpu-verification"
          echo "TMPDIR=$RUNNER_TEMP/cpu-verification" >> "$GITHUB_ENV"
      - name: Install the CPU verification environment
        run: |
          python -m pip install --only-binary=:all: -r requirements-verification.txt
          python -m pip check
          python -m pip freeze
      - name: Test statistical contracts and committed examples
        run: |
          python -m pytest -q \
            tests/test_bootstrap_ci.py \
            tests/test_condition_ci.py \
            tests/test_speaker_cluster_ci.py \
            tests/test_scorer_sensitivity.py \
            tests/test_repetition_sensitivity.py \
            tests/test_footprint.py \
            tests/test_footprint_job_scope.py \
            tests/test_benchmark_masking.py \
            tests/test_wer_normalisation.py \
            tests/test_wer_aggregate.py \
            tests/test_confidence.py \
            tests/test_review_repeated_passages.py \
            tests/test_provenance.py \
            tests/test_example_variants.py \
            tests/test_installed_distribution.py \
            tests/test_verify_regeneration.py \
            tests/test_build_input_deposit.py
      - name: Regenerate and compare all eleven CPU artefacts
        run: |
          if python tools/verify_regeneration.py --keep; then
            exit 0
          fi
          for log in "$TMPDIR"/verify_regen_*/*.log; do
            if [ -f "$log" ]; then
              printf '\nProducer log: %s\n' "$log"
              tail -n 80 "$log"
            fi
          done
          exit 1
